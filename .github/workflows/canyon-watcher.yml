name: Canyon Bike Watcher

on:
  schedule:
    - cron: "2-59/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canyon-bike-watcher
  cancel-in-progress: false

jobs:
  check-product:
    name: Check Canyon product
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble

    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Verify Git checkout
        run: |
          echo "Current directory:"
          pwd

          echo "GitHub workspace:"
          echo "$GITHUB_WORKSPACE"

          echo "Workspace contents:"
          ls -la "$GITHUB_WORKSPACE"

          echo "Git status:"
          git -C "$GITHUB_WORKSPACE" status

      - name: Install Python dependencies
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check product page
        working-directory: ${{ github.workspace }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PRODUCT_URL: https://www.canyon.com/sv-se/landsvaegscyklar/triathlon-cykel/speedmax/cf-slx/speedmax-cf-slx-7-di2/4518.html
          STATE_FILE: ${{ github.workspace }}/state.json
        run: |
          python watcher.py

      - name: Check product page
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PRODUCT_URL: https://www.canyon.com/sv-se/landsvaegscyklar/triathlon-cykel/speedmax/cf-slx/speedmax-cf-slx-7-di2/4518.html
          STATE_FILE: state.json
          TEST_DISCORD: "true"
        run: |
          python watcher.py      

      - name: Save state.json
        working-directory: ${{ github.workspace }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "Ingen state-ändring att committa."
          else
            git commit -m "chore: update Canyon watcher state"
            git push
          fi