name: Canyon Bike Watcher

on:
  # Kör var femte minut.
  #
  # 2-59/5 betyder:
  # 2, 7, 12, 17, 22, ... 57
  #
  # Vi börjar på minut 2 i stället för exakt minut 0
  # för att minska risken för hög belastning vid heltimmen.
  schedule:
    - cron: "2-59/5 * * * *"

  # Gör det möjligt att starta workflowet manuellt
  # från GitHub Actions-sidan.
  workflow_dispatch:

# Vi behöver skriva tillbaka state.json till repositoryt.
permissions:
  contents: write

# Förhindrar att två kontroller körs parallellt
# och skriver state.json samtidigt.
concurrency:
  group: canyon-bike-watcher
  cancel-in-progress: false

jobs:
  check-product:
    name: Check Canyon product
    runs-on: ubuntu-latest

    # Playwrights officiella Python-container.
    # Den innehåller Chromium och nödvändiga Linux-beroenden.
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble

    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Gör checkout med GITHUB_TOKEN så att nästa steg
          # kan pusha en ändring av state.json.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check product page
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PRODUCT_URL: https://www.canyon.com/sv-se/landsvaegscyklar/triathlon-cykel/speedmax/cf-slx/speedmax-cf-slx-7-di2/4518.html
          STATE_FILE: state.json
        run: |
          python watcher.py

      - name: Save state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "Ingen state-ändring att committa."
          else
            git commit -m "chore: update Canyon watcher state"
            git push
          fi